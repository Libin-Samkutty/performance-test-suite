services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: jmeter
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [jmeter-net]

  # Renders dashboard panels to PNG for CI screenshot capture (GitHub Pages
  # publishing). Run as its own service rather than via GF_INSTALL_PLUGINS
  # inside the grafana container — that keeps the heavy headless-Chromium
  # dependency isolated from the main Grafana image, matching Grafana's
  # own documented production recommendation.
  renderer:
    image: grafana/grafana-image-renderer:latest
    ports:
      - "8081:8081"
    networks: [jmeter-net]

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
      renderer:
        condition: service_started
    networks: [jmeter-net]

  # No default command: invoke per-suite via
  #   docker compose run --rm jmeter -n -t /jmeter/jmx/<suite>/<file>.jmx \
  #     -l /jmeter/results/<name>.jtl -Jinfluxdb_url=http://influxdb:8086/write?db=jmeter ...
  jmeter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ../jmx:/jmeter/jmx
      - ../data:/jmeter/data
      - ../config:/jmeter/config
      - ../results:/jmeter/results
      - ../reports:/jmeter/reports
    environment:
      JMETER_ENV: staging
    networks: [jmeter-net]

volumes:
  influxdb-data:
  grafana-data:

networks:
  jmeter-net:
