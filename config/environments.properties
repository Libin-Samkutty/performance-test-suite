# ============================================================
# Environment-Specific Threshold Overrides
# ============================================================
# Usage: jmeter -Jenvironment=staging -t test.jmx
# The check_thresholds.py script accepts --environment to
# apply the matching overrides on top of base thresholds.
# ============================================================

# --- Staging (relaxed) ---
staging.avg.response.time.max=1200
staging.p90.response.time.max=1800
staging.p95.response.time.max=2200
staging.p99.response.time.max=3000
staging.max.response.time.max=8000
staging.http.error.rate.max=2.0
staging.connection.timeout.rate.max=1.0
staging.assertion.failure.rate.max=2.0
staging.min.tps.restful_booker=5
staging.min.rps.dummyjson=15

# --- Production (strict) ---
production.avg.response.time.max=600
production.p90.response.time.max=900
production.p95.response.time.max=1200
production.p99.response.time.max=1800
production.max.response.time.max=4000
production.http.error.rate.max=0.5
production.connection.timeout.rate.max=0.2
production.assertion.failure.rate.max=0.5
production.min.tps.restful_booker=15
production.min.rps.dummyjson=40